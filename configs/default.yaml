# DLLM Default Configuration

model:
  backbone: "roberta-base"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]   # KEEP, DELETE, REPLACE, INSERT, EXPAND
  len_smoothing: 0.15         # spread this mass to adjacent length classes

tokenizer:
  base: "roberta-base"
  max_length: 192

training:
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 500
  # With K=5 sub-iterations, each optimizer step costs ~5× more compute than single-stage
  # training. max_steps and gradient_accumulation_steps are halved to maintain a roughly
  # equivalent total training FLOPs budget. Adjust as needed for longer runs.
  max_steps: 25000               # reduced from 50000 (5 sub-iters ≈ 2.5× more FLOPs/step)
  gradient_accumulation_steps: 2 # reduced from 4 (see throughput note above)
  log_every: 10
  eval_every: 500
  scheduled_sampling_prob: 0.3   # train on the model's own sampled tokens (fixing self-errors)
  # Progressive sub-iteration training: for each (prompt, response) pair, generate a
  # trajectory of K canvases at decreasing noise levels, directly mirroring inference.
  # Set to null (or remove) to disable and revert to single-stage random-t training.
  sub_iterations: [1.0, 0.8, 0.6, 0.4, 0.2]
  # Loss weights per stage — upweights high-masking stages to preserve the t_skew
  # curriculum (model trains harder on near-fully-masked canvases like inference start).
  sub_iteration_weights: [2.0, 1.5, 1.0, 0.75, 0.5]

data:
  dataset_name: "tiny-shakespeare"
  val_dataset_name: "tiny-shakespeare"
  mode: "prompt_response"       # "prompt_response" or "unconditional"
  max_prompt_length: 48
  max_response_length: 48       # upper bound for the prompt-predicted length M
  corruption:
    replace_ratio: 0.10        # fraction of response tokens to randomly replace
    delete_ratio: 0.05          # fraction of response tokens to randomly delete
    insert_ratio: 0.05          # fraction of positions to insert noise
    expand_ratio: 0.05          # fraction of response spans to merge into [EXPAND]
    mask_ratio: 0.80            # fraction of corrupted slots that become <MASK> (rest are noise)
    noise_vocab_size: 100       # use top-N frequent tokens as noise source
    expand_prob: 0.10           # probability of EXPAND on any response slot
    insert_prob: 0.15           # probability of INSERT on any interleaving mask in response
    t_skew: 2.0                 # noise level t ~ 1 - U^t_skew (skewed toward full masking)
    shortage_prob: 0.35         # build canvas 1-2 slots short so the model learns INSERT/EXPAND

inference:
  max_iterations: 20            # max refinement steps
  keep_threshold: 0.9           # confidence threshold to KEEP a token
  confidence_threshold: 0.0     # default 0.0 to trust Tagger KEEP predictions
