# DLLM English <-> Hindi Translation — Kaggle configuration
# Same as translation.yaml but tuned for 16GB GPUs (T4/P100): batch 8.
# Copy of translation.yaml with batch_size 8 / gradient_accumulation_steps 2
# (effective batch stays 16).

model:
  backbone: "xlm-roberta-base"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]   # KEEP, DELETE, REPLACE, INSERT, EXPAND
  len_smoothing: 0.15

tokenizer:
  base: "xlm-roberta-base"
  max_length: 192

training:
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 50000
  gradient_accumulation_steps: 2
  log_every: 10
  eval_every: 500
  scheduled_sampling_prob: 0.3
  bleu_every: 100             # evaluate BLEU every N steps
  bleu_n: 50

data:
  dataset_name: "./data/en_hi_both_train.tsv"
  val_dataset_name: "./data/en_hi_both_val.tsv"
  bleu_test_path: "./data/en_hi_test.tsv"       # en->hi held-out BLEU set
  bleu_n: 50
  mode: "prompt_response"
  max_prompt_length: 64
  max_response_length: 64
  corruption:
    replace_ratio: 0.10
    delete_ratio: 0.05
    insert_ratio: 0.05
    expand_ratio: 0.05
    mask_ratio: 0.80
    noise_vocab_size: 100
    expand_prob: 0.10
    insert_prob: 0.15
    t_skew: 2.0
    shortage_prob: 0.35

inference:
  max_iterations: 20
  keep_threshold: 0.9
  confidence_threshold: 0.0
