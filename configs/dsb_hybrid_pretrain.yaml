# DLLM — DSBHybrid pretraining (Diffusion Schrödinger Bridge + discrete edits).
#
# Jointly learns:
#   * continuous DP1 -> DP2 SDE transport (denoising score matching), and
#   * discrete edit structure (tagger=head edit ops + generator=head tokens).
#
# Corruption schemes (data.corruption_scheme):
#   "fixed" — in-place mask/REPLACE (phase 1; exact position alignment).
#   "full"  — full Levenshtein edit grammar via ForwardCorruptor (phase 2;
#             INSERT/DELETE/EXPAND), aligned to the SDE canvas.

model:
  embedder: "xlm-roberta-base"
  max_length: 128
  # FROZEN. Jointly training the encoder is degenerate here: the score-matching
  # loss rewards making DP2 predictable from DP1 (its irreducible term is
  # Var(DP2 | x_t, DP1)/sigma2, amplified at low t), so a trainable encoder
  # collapses to input-insensitive embeddings (observed: identity baseline
  # 5.5-9.9 -> 0.003 within 700 steps). The gen/tag heads were only accidentally
  # preventing this. The bridge operates on the fixed pretrained space instead.
  train_embedder: false
  gradient_checkpointing: false
  # Edit-conditioned score network (phase 2): conditions the drift on prior
  # edit tags. Set true when using corruption_scheme "full".
  edit_conditioned_score: false
  # Score network: "mlp" (per-position) or "transformer" (self-attention over
  # positions — denoising can use other positions' SDE states, attacking the
  # per-position MLP's ~65% signal ceiling).
  score_net: "transformer"
  num_heads: 8
  # Condition tagger/generator heads on t + DP1. Without t the tagger cannot
  # distinguish "clean because t~0" from "never corrupted" and collapses to the
  # class prior; with DP1 it compares current state vs source, which is also
  # what makes the heads usable at generation time (t=1, cond=DP1).
  condition_heads: true
  # Score network (MLP) hyperparameters.
  hidden_dim: 512
  num_layers: 3
  time_embed_dim: 128
  # Optional per-class weights for the tagger (KEEP/DELETE/REPLACE/INSERT/EXPAND).
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]

dsb:
  beta_schedule: "linear"
  num_steps: 1000
  beta_min: 0.0001
  beta_max: 0.02
  # Condition the score net on the source endpoint DP1 (see dsb_pretrain.yaml).
  condition_on_dp1: true
  # "bridge" = variance vanishes at BOTH endpoints (true two-ended bridge;
  # terminal state pinned to DP2, no noise for the score net to cancel).
  # "ou" = legacy schedule (sigma2 saturates at 0.5). Checkpoints record this,
  # so generation rebuilds the matching schedule.
  sigma2_schedule: "bridge"

data:
  train_path: "./data/pretrain_en.txt"
  val_path: null
  shuffle_buffer: 100000
  val_max_batches: 100
  corruption_scheme: "full"     # "fixed" | "full" (full enables Levenshtein INSERT/DELETE/EXPAND/REPLACE)
  corruption:
    noise_vocab_size: 30000      # Samples from real dictionary words (top 30k)
    mask_prob: 0.25
    mask_ratio: 0.25             # 25% <mask_id>, 75% real words / typos
    replace_ratio: 0.15          # 15% random real word & typo replacement (teaches REPLACE on real words)
    delete_ratio: 0.08           # 8% words deleted (teaches INSERT / EXPAND)
    insert_ratio: 0.08           # 8% extraneous words inserted (teaches DELETE)
    expand_ratio: 0.05           # 5% spans compressed into [EXPAND]
    expand_prob: 0.10            # (full scheme)
    insert_prob: 0.15            # (full scheme)
    t_skew: 2.0                  # (full scheme)
    shortage_prob: 0.35          # (full scheme)

training:
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 200000
  log_every: 10
  eval_every: 500
  diag_every: 100
  recon_steps: 50         # reverse-SDE steps for recon_err (50 steps: fast and numerically stable)
  grad_clip: 1.0
  mixed_precision: true
  # Joint-loss weighting for the tagger / generator heads. With a frozen
  # encoder these no longer compete with the score net for encoder gradients,
  # so 1.0 is safe (and the heads learn at full speed).
  lambda_tag: 1.0
  lambda_gen: 1.0
