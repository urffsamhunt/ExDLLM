# DLLM English <-> Hindi Translation Configuration
# Backbone: XLM-RoBERTa (multilingual SentencePiece vocab with Devanagari;
# roberta-base would tokenize Hindi as byte-level garbage).

model:
  backbone: "xlm-roberta-base"
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]   # KEEP, DELETE, REPLACE, INSERT, EXPAND
  len_smoothing: 0.15         # spread this mass to adjacent length classes

tokenizer:
  base: "xlm-roberta-base"
  max_length: 192

training:
  batch_size: 2               # XLM-R (250k vocab, 471M params) is memory-heavy on 8GB
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 50000
  gradient_accumulation_steps: 8   # effective batch stays 16
  log_every: 10
  eval_every: 500
  scheduled_sampling_prob: 0.3
  bleu_every: 100             # evaluate BLEU on the held-out test set every N steps
  bleu_n: 50                  # number of test pairs per evaluation

data:
  dataset_name: "./data/en_hi_both_train.tsv"   # en->hi and hi->en pairs
  val_dataset_name: "./data/en_hi_both_val.tsv"
  bleu_test_path: "./data/en_hi_test.tsv"       # en->hi held-out BLEU set
  bleu_n: 50
  mode: "prompt_response"
  max_prompt_length: 64
  max_response_length: 64     # length-head upper bound
  corruption:
    replace_ratio: 0.10
    delete_ratio: 0.05
    insert_ratio: 0.05
    expand_ratio: 0.05
    mask_ratio: 0.80
    noise_vocab_size: 100
    expand_prob: 0.10
    insert_prob: 0.15
    t_skew: 2.0
    shortage_prob: 0.35

inference:
  max_iterations: 20
  keep_threshold: 0.9
  confidence_threshold: 0.0
