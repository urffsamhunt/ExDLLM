# DLLM — DSBHybrid Bidirectional Translation (English <-> Hindi)
#
# Fine-tunes the pretrained DSBHybrid model on parallel TSV pairs.
# Protects the source language prompt while training the continuous bridge
# and discrete edit heads to generate the target translation.

model:
  embedder: "xlm-roberta-base"
  max_length: 192               # Length capacity for prompt + response
  train_embedder: false         # Keep encoder frozen to preserve multilingual manifold
  score_net: "transformer"
  num_heads: 8
  condition_heads: true
  edit_conditioned_score: false
  hidden_dim: 512
  num_layers: 3
  time_embed_dim: 128
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]
  tie_weights: true

dsb:
  beta_schedule: "linear"
  num_steps: 1000
  beta_min: 0.0001
  beta_max: 0.02
  condition_on_dp1: true
  sigma2_schedule: "bridge"

data:
  # Bidirectional translation dataset (en->hi and hi->en pairs)
  train_path: "./data/en_hi_both_train.tsv"
  val_path: "./data/en_hi_both_val.tsv"
  shuffle_buffer: 50000
  val_max_batches: 50
  corruption_scheme: "full"
  corruption:
    noise_vocab_size: 30000
    mask_prob: 0.80             # Target response region starts mostly masked
    mask_ratio: 0.80
    replace_ratio: 0.10
    delete_ratio: 0.05
    insert_ratio: 0.05
    expand_ratio: 0.05
    expand_prob: 0.10
    insert_prob: 0.15
    t_skew: 2.0
    shortage_prob: 0.35

training:
  batch_size: 4
  learning_rate: 0.00003        # Lower LR for fine-tuning stability
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 50000
  log_every: 10
  eval_every: 500
  diag_every: 100
  recon_steps: 50
  grad_clip: 1.0
  mixed_precision: true
  lambda_tag: 1.0
  lambda_gen: 1.0

inference:
  sde_steps: 50
  max_iterations: 10
  temperature: 1.0
  top_k: 50
  top_p: 0.9
