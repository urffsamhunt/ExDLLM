# DLLM Hindi Pretraining Configuration
#
# Continued pretraining / domain adaptation of the XLM-RoBERTa backbone on
# clean monolingual Hindi (Wikipedia, gated to predominantly Devanagari text),
# using DLLM's unconditional denoising objective. This teaches Hindi grammar
# and the edit-vocabulary denoising dynamics before any translation fine-tuning
# (which uses parallel data and prompt_response mode).
#
# Same structure as pretrain_en.yaml; only the data path differs.

model:
  backbone: "xlm-roberta-base"   # NOTE: Hindi needs a multilingual tokenizer; roberta-base
  hidden_dropout_prob: 0.1        # would byte-fallback Devanagari. xlm-roberta-base (~279M)
  attention_probs_dropout_prob: 0.1
  tag_weights: [0.7, 0.8, 1.0, 2.0, 4.0]   # KEEP, DELETE, REPLACE, INSERT, EXPAND
  len_smoothing: 0.15

tokenizer:
  base: "xlm-roberta-base"   # keep multilingual for Devanagari
  max_length: 192

training:
  batch_size: 1               # XLM-R (250k vocab, 471M params) is memory-heavy;
                              # 1 keeps the shared-DRAM XPU / common 8GB from OOMing.
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 50000
  gradient_accumulation_steps: 2   # reduced from 8 (see pretrain_en.yaml)
  log_every: 10
  eval_every: 500
  scheduled_sampling_prob: 0.0     # no self-draft during unconditional pretraining
  # See pretrain_en.yaml — cap validation batches to keep eval cheap.
  val_max_batches: 100

data:
  dataset_name: "./data/pretrain_hi.txt"   # plain text, one cleaned Devanagari chunk per line
  val_dataset_name: "./data/pretrain_hi.txt"
  mode: "unconditional"
  max_prompt_length: 48
  max_response_length: 48
  corruption:
    replace_ratio: 0.10
    delete_ratio: 0.05
    insert_ratio: 0.05
    expand_ratio: 0.05
    mask_ratio: 0.80
    noise_vocab_size: 100
    expand_prob: 0.10
    insert_prob: 0.15
    t_skew: 2.0
    shortage_prob: 0.35

inference:
  max_iterations: 20
  keep_threshold: 0.9
  confidence_threshold: 0.0
